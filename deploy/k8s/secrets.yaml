apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: hotel-platform
type: Opaque
stringData:
  ConnectionStrings__ReservationDb: "Host=reservation-db;Port=5432;Database=HotelReservationsDB;Username=postgres;Password=postgres"
  ConnectionStrings__CatalogDb: "Host=catalog-db;Port=5432;Database=HotelCatalogDB;Username=postgres;Password=postgres"
  ConnectionStrings__IdentityDb: "Host=identity-db;Port=5432;Database=hotel_identity;Username=postgres;Password=postgres"
  ConnectionStrings__ReviewsDb: "mongodb://reviews-db:27017"
  Redis__ConnectionString: "redis:6379"
  RabbitMQ__ConnectionString: "rabbitmq:5672"
  Jwt__SecretKey: "your-super-secret-jwt-key-change-in-production-min-32-chars"