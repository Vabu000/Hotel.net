apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: platform-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: services__catalog-service__http__0
              value: http://catalog-service
            - name: services__reservation-service__http__0
              value: http://reservation-service
            - name: services__reviews-service__http__0
              value: http://reviews-service
            - name: services__aggregator__http__0
              value: http://aggregator
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
