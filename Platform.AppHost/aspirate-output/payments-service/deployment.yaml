apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: hotel-platform
  labels:
    app: payments-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      containers:
        - name: payments-service
          image: payments-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: platform-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: hotel-platform
spec:
  type: ClusterIP
  selector:
    app: payments-service
  ports:
    - port: 80
      targetPort: 8080
